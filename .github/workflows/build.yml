name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ── Arch Linux (primary target distribution) ──────────────────────────────
  build-arch:
    name: Full build — Arch Linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install git (needed for checkout action inside container)
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Install build dependencies
        run: |
          pacman -Su --noconfirm
          pacman -S --noconfirm \
            base-devel \
            cmake \
            ninja \
            extra-cmake-modules \
            libplasma \
            kirigami \
            qt6-declarative \
            qt6-webchannel \
            qt6-webengine \
            glfw \
            vulkan-headers \
            mpv \
            lz4

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON \
            -G Ninja

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure
          ctest --test-dir build -R qml_tests --no-tests=error --output-on-failure

      - name: Reconfigure and test without video textures
        run: |
          cmake -B build -S . -DWEKDE_VIDEO_TEXTURES=OFF
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Build standalone scene viewers
        run: |
          cmake -B build/viewer -S src/backend_scene/standalone_view \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_QML=ON -DBUILD_TESTS=ON -G Ninja
          cmake --build build/viewer --target sceneviewer sceneviewer-qml -j"$(nproc)"

  # ── Fedora (secondary target distribution) ───────────────────────────────
  build-fedora:
    name: Full build — Fedora
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --force --recursive

      - name: Enable RPM Fusion (needed for mpv)
        run: |
          dnf install -y \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm" \
            "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm"
          dnf swap -y ffmpeg-free ffmpeg --allowerasing
          dnf install -y ffmpeg-devel --allowerasing

      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake \
            ninja-build \
            extra-cmake-modules \
            vulkan-headers \
            plasma-workspace-devel \
            kf6-plasma-devel \
            kf6-kcoreaddons-devel \
            kf6-kpackage-devel \
            lz4-devel \
            mpv-libs-devel \
            qt6-qtbase-private-devel \
            libplasma-devel \
            kf6-kirigami \
            qt6-qtwebchannel-devel \
            qt6-qtwebengine \
            qt6-qtdeclarative-devel

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON \
            -G Ninja

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure
          ctest --test-dir build -R qml_tests --no-tests=error --output-on-failure

  # ── Hyprland host (separate CMake project, no KDE dependencies) ───────────
  build-hyprland:
    name: Hyprland host build and unit tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install git (needed for checkout action inside container)
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4
        # No submodules needed — the host does not build the scene renderer

      - name: Install build dependencies
        run: |
          pacman -Su --noconfirm
          pacman -S --noconfirm \
            base-devel \
            cmake \
            ninja \
            qt6-base \
            qt6-declarative \
            qt6-webengine \
            qt6-wayland \
            layer-shell-qt

      - name: Configure
        run: |
          cmake -B build/hyprland -S hyprland \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: cmake --build build/hyprland -j"$(nproc)"

      - name: Run unit tests
        # The Wayland smoke test needs a real session and stays opt-in.
        run: ctest --test-dir build/hyprland -L unit --output-on-failure
